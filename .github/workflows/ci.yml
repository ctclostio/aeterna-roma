name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run public source and fixture tests
        run: python scripts/run_public_tests.py

  native:
    name: Windows x64 (${{ matrix.profile }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: analyze
            asan: 'OFF'
          - profile: asan
            asan: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure public native tests
        run: cmake -S tests/native -B out/public-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DROME2_TYPES_ASAN=${{ matrix.asan }}
      - name: Build with warnings as errors
        run: cmake --build out/public-native --parallel 4
      - name: Run native tests
        run: ctest --test-dir out/public-native --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.profile }}
          path: |
            out/public-native/test-results.xml
            out/public-native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
