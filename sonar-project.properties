sonar.projectKey=ctclostio_aeterna-roma
sonar.organization=ctclostio
sonar.host.url=https://sonarcloud.io
sonar.projectName=Aeterna Roma
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.links.homepage=https://github.com/ctclostio/aeterna-roma
sonar.links.scm=https://github.com/ctclostio/aeterna-roma
