sonar.test.inclusions=**/test_*.py,**/test_*.ps1,**/test_*.c,**/test_*.h,tests/**
sonar.exclusions=**/test_*.py,**/test_*.ps1,**/test_*.c,**/test_*.h,**/__pycache__/**
sonar.python.version=3.14,3.15
sonar.cfamily.compile-commands=out/public-native/compile_commands.json
